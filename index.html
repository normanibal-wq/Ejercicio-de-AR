<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelo AR - AQ425</title>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>
  <style>
    body { margin:0; font-family:sans-serif; }
    model-viewer { width:100vw; height:100vh; background:#eee; }
  </style>
</head>
<body>
  <model-viewer
    src="Estatua01.glb"
    alt="Modelo 3D del proyecto"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>
</body>
</html>
